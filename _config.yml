# Jekyll Configuration for Bible Study Guide

# Site settings
title: Bible Study Guide
description: >-
  A comprehensive study guide covering all 66 books of the Bible with overviews,
  themes, practical applications, and study resources.
baseurl: "/biblestudy" # Leave empty if deploying to username.github.io/biblestudy
url: "" # Will be set automatically by GitHub Pages

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude files from processing
exclude:
  - .git
  - .gitignore
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - DEPLOYMENT.md

# Defaults for pages
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: "old-testament"
    values:
      layout: "book"
      testament: "Old Testament"
  - scope:
      path: "new-testament"
    values:
      layout: "book"
      testament: "New Testament"

# Navigation
navigation:
  - title: Home
    url: /
  - title: Old Testament
    url: /old-testament/
  - title: New Testament
    url: /new-testament/
  - title: Quick Reference
    url: /quick-reference/
  - title: Resources
    url: /resources/
